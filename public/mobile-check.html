<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Responsive preview</title><style>body{margin:16px;background:#eee;font:16px system-ui}label,button{margin:0 12px 12px 0}iframe{display:block;width:375px;height:850px;border:1px solid #777;background:#071627}</style><label>表示幅 <select id="width"><option>320</option><option selected>375</option><option>390</option><option>768</option></select></label><button id="streams">動画欄</button><button id="schedule">週間予定</button><button id="visuals">衣装</button><iframe title="モバイル表示確認" src="/"></iframe><script>const f=document.querySelector('iframe');document.querySelector('select').onchange=e=>f.style.width=e.target.value+'px';for(const id of ['streams','schedule','visuals'])document.getElementById(id).onclick=()=>f.contentWindow.location.hash=id;</script></html>
